name: japanese-tech-writing dependency validation

on:
  pull_request:
    paths:
      - .github/workflows/japanese-tech-writing-validate.yml
      - packages/japanese-tech-writing/**
      - apm.yml
      - apm.lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned APM toolchain
        uses: jdx/mise-action@v2
      - name: Verify root lockfile is installable without re-resolution
        shell: bash
        run: |
          set -euo pipefail
          mise exec -- apm install --frozen
          git diff --exit-code -- apm.yml apm.lock.yaml

      - name: Install Gist dependency through APM in isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mise exec -- bash -c '
            set -euo pipefail
            cd "$1"
            apm install "$2" --target agent-skills
            skill=".agents/skills/fd287c3133457c4fd8f5601d34aa817d/SKILL.md"
            test -f "$skill"
            grep -q "^name: japanese-tech-writing" "$skill"
            echo "Gist-native Skill installed via APM successfully: $skill"
          ' bash "$temp" "$GITHUB_WORKSPACE/packages/japanese-tech-writing"
