name: japanese-tech-writing dependency validation

on:
  pull_request:
    paths:
      - .github/workflows/japanese-tech-writing-validate.yml
      - packages/japanese-tech-writing/**
      - apm.yml
      - apm.lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned APM toolchain
        uses: jdx/mise-action@v2
      - name: Install Gist dependency through APM in isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mise exec -- bash -c '
            set -euo pipefail
            cd "$1"
            apm install "$2" --target agent-skills
            echo "Deployed Skill paths:"
            find .agents/skills -maxdepth 3 -type f -print
            test -n "$(find .agents/skills -name SKILL.md -type f -print -quit)"
            grep -Rl --include="SKILL.md" "^name: japanese-tech-writing" .agents/skills
            echo "Gist-native Skill installed via APM successfully."
          ' bash "$temp" "$GITHUB_WORKSPACE/packages/japanese-tech-writing"
