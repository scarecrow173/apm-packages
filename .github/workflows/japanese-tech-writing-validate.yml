name: japanese-tech-writing validation

on:
  pull_request:
    paths:
      - .github/workflows/japanese-tech-writing-upstream.yml
      - .github/workflows/japanese-tech-writing-validate.yml
      - packages/japanese-tech-writing/**
      - scripts/japanese-tech-writing/**
      - apm.lock.yaml
      - apm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and checked-in lock integrity
        run: python3 -m unittest discover -s scripts/japanese-tech-writing -p "test_*.py" -v
      - name: Install pinned APM toolchain
        uses: jdx/mise-action@v2
      - name: Validate APM Skill installation in isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          # mise captures the pinned toolchain before entering the consumer.
          mise exec -- bash -c '
            set -euo pipefail
            cd "$1"
            apm install "$2" --target agent-skills
            cmp -s .agents/skills/japanese-tech-writing/SKILL.md \
              "$2/.apm/skills/japanese-tech-writing/SKILL.md"
          ' bash "$temp" "$GITHUB_WORKSPACE/packages/japanese-tech-writing"
