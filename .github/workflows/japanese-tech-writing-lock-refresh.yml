name: Regenerate APM lock for japanese-tech-writing dependency migration

on:
  pull_request:
    paths:
      - .github/workflows/japanese-tech-writing-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: japanese-tech-writing-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/japanese-tech-writing-apm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: jdx/mise-action@v2
      - name: Re-resolve root devDependencies using pinned APM version
        shell: bash
        run: |
          set -euo pipefail
          mise exec -- apm install
          git diff --check
          git add -- apm.lock.yaml
          if git diff --cached --quiet; then
            echo 'Root apm.lock.yaml is current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(apm): regenerate lock for Gist dependency'
          git push origin HEAD:"$GITHUB_HEAD_REF"
