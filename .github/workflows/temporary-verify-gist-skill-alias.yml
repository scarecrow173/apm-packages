name: Temporary verification of Gist Skill alias (remove before merge)

on:
  pull_request:
    paths:
      - .github/workflows/temporary-verify-gist-skill-alias.yml

permissions:
  contents: write

concurrency:
  group: temporary-gist-alias-verification
  cancel-in-progress: false

jobs:
  verify-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/japanese-tech-writing-apm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: jdx/mise-action@v2
      - name: Verify alias in an isolated consumer before modifying PR files
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          cp -a packages/japanese-tech-writing "$temp/package"
          mkdir "$temp/consumer"
          python3 - "$temp/package/apm.yml" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text()
          line = "    - git: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d.git\n"
          assert text.count(line) == 1, "unexpected Gist dependency shape"
          p.write_text(text.replace(line, line + "      alias: japanese-tech-writing\n"))
          PY
          mise exec -- bash -c '
            set -euo pipefail
            cd "$1/consumer"
            apm install "$1/package" --target agent-skills
            test -f .agents/skills/japanese-tech-writing/SKILL.md
            grep -q "^name: japanese-tech-writing" .agents/skills/japanese-tech-writing/SKILL.md
            test ! -e .agents/skills/fd287c3133457c4fd8f5601d34aa817d
            grep -q "alias: japanese-tech-writing" apm.lock.yaml
            apm install --frozen
            test -f .agents/skills/japanese-tech-writing/SKILL.md
          ' bash "$temp"
          echo "Isolated alias install + frozen replay: verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply proven alias and regenerate root lock using pinned APM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packages/japanese-tech-writing/apm.yml")
          text = p.read_text()
          line = "    - git: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d.git\n"
          assert text.count(line) == 1, "unexpected Gist dependency shape"
          p.write_text(text.replace(line, line + "      alias: japanese-tech-writing\n"))
          PY
          mise exec -- apm install
          mise exec -- apm install --frozen
          git diff --check
          git diff --exit-code -- apm.yml
          git add -- packages/japanese-tech-writing/apm.yml apm.lock.yaml
          if git diff --cached --quiet; then
            echo "Alias already applied." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(japanese-tech-writing): use alias for readable Skill install path"
          git fetch origin "$GITHUB_HEAD_REF"
          git rebase "origin/$GITHUB_HEAD_REF"
          git push origin HEAD:"$GITHUB_HEAD_REF"
          echo "Updated PR manifest and root lock after successful alias verification" >> "$GITHUB_STEP_SUMMARY"
