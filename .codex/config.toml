sandbox_mode = "workspace-write"
[mcp_servers.mise]
args = ["mcp"]
command = "mise"

[features]
hooks = true

[[hooks.SessionStart]]
matcher = "^startup$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/codex-setup.sh"'
command_windows = 'powershell -NoProfile -ExecutionPolicy Bypass -File "$((git rev-parse --show-toplevel))\.codex\codex-setup-windows.ps1"'
timeout = 600
statusMessage = "Setting up project environment"