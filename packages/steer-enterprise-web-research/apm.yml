name: steer-enterprise-web-research
version: 0.1.0
description: SteER / Enterprise Deep Research style web research workflow for Codex and GitHub Copilot.
author: Akiyoshi Koyama
license: MIT
target:
  - codex
  - copilot
type: skill
includes:
