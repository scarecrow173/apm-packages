name: pstack-devin
version: 0.1.0
description: Devin CLI compatible distribution of upstream pstack (cursor/plugins harness/pstack/claude-code), pinned to a fixed upstream commit.
author: Akiyoshi Koyama
license: MIT
targets:
  - codex
  - copilot
  - cursor
  - claude
  - windsurf
  - agent-skills
dependencies:
  apm:
    # pstack's external skill deps (cursor-team-kit has no Devin manifest).
    # Virtual claude_skill deps — deploy to target skill dirs on every
    # declared target. Refs track upstream.yml upstream.commit.
    - cursor/plugins/cursor-team-kit/skills/deslop#b4a4f6151b8e77f8d71045f09f553a733cf0ed37
    - cursor/plugins/cursor-team-kit/skills/control-cli#b4a4f6151b8e77f8d71045f09f553a733cf0ed37
    - cursor/plugins/cursor-team-kit/skills/control-ui#b4a4f6151b8e77f8d71045f09f553a733cf0ed37
devDependencies:
  apm:
    - git: https://github.com/cursor/plugins.git
      path: harness/pstack/claude-code
      ref: b4a4f6151b8e77f8d71045f09f553a733cf0ed37
      targets: [copilot]
