name: doc-driven-dev
version: 0.1.0
description: Document-driven development skills for discovery orchestration, ADRs, specs, designs, plans, tasks, implementation records, and document status auditing.
author: Akiyoshi Koyama
license: MIT
targets:
  - codex
  - copilot
  - cursor
  - claude
  - agent-skills
includes:
  - .apm/
scripts:
  validate: "apm compile --validate"
  preview: "apm compile --dry-run"
  test: "pnpm test"
  lint-md: "pnpm run lint:md"
