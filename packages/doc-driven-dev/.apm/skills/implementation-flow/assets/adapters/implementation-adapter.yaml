# yaml-language-server: $schema=../../../skill-discovery-protocol/schemas/adapter.schema.json
schema_version: "1.0"
adapter_id: "implementation-flow-default"
extends:
  - "general"
profile:
  title: "Implementation Profile"
flow_stack:
  slots:
    - slot_id: "process_diagnosis"
      slot_type: "exclusive"
      activation: "conditional"
    - slot_id: "build_structure"
      slot_type: "layerable"
      activation: "always"
    - slot_id: "subagent_utilization"
      slot_type: "layerable"
      activation: "conditional"
    - slot_id: "cost_optimization"
      slot_type: "layerable"
      activation: "conditional"
    - slot_id: "implementation_documentation"
      slot_type: "layerable"
      activation: "always"
      default:
        - skill: "impl-doc"
          reason: "Open implementation documentation before code changes begin"
    - slot_id: "verification"
      slot_type: "layerable"
      activation: "conditional"
    - slot_id: "review_gate"
      slot_type: "exclusive"
      activation: "always"
classification:
  unmatched:
    action: "assign"
    category: "uncategorized"
    severity: "warn"
  taxonomy:
    - id: "process"
      label: "Process"
      description: "Skills that determine how to approach problems"
      match:
        capabilities: ["debugging", "planning", "task_breakdown"]
        tags: ["process", "diagnosis"]
        description_patterns: ["debug", "diagnos", "plan", "breakdown"]
    - id: "build"
      label: "Build"
      description: "Skills that structure how to execute"
      match:
        capabilities: ["incremental_implementation", "parallel_dispatch", "subagent_dispatch", "test_led_development"]
        tags: ["build", "implementation", "tdd", "parallel", "subagent"]
        description_patterns: ["implement", "incremental", "parallel", "subagent", "delegat", "test-driven"]
    - id: "documentation"
      label: "Documentation"
      description: "Skills that record implementation progress and evidence"
      match:
        capabilities: ["implementation_documentation"]
        tags: ["documentation", "impl-doc"]
        description_patterns: ["impl-doc", "implementation record", "experiment log", "docs/impl"]
    # Lane boundary (#146): verify and review are distinct lanes.
    # verify = correctness validation, including adversarial review.
    # review = post-implementation judgment gates (code review, security
    # audit). review description_patterns are phrase-level or word-anchored
    # so that "adversarial review" resolves to verify only, and so that
    # words like "investigate" cannot collide via the substring "gate".
    # A skill that genuinely spans both lanes (e.g., declares both
    # adversarial_review and code_review) remains a correct multi-category
    # member.
    - id: "verify"
      label: "Verify"
      description: "Skills that validate correctness, including adversarial review"
      match:
        capabilities: ["source_verification", "adversarial_review"]
        tags: ["verify", "validation"]
        description_patterns: ["verify", "validat", "adversarial", "source-driven"]
    - id: "review"
      label: "Review"
      description: "Skills that provide post-implementation gates"
      match:
        capabilities: ["code_review", "security_audit"]
        tags: ["review", "audit"]
        description_patterns: ["code review", "security audit", "post-implementation", "\\bgate"]
    - id: "domain"
      label: "Domain"
      description: "Language/framework/platform-specific skills"
      match:
        capabilities: []
        tags: ["domain", "language", "framework"]
        description_patterns: ["typescript", "react", "python", "frontend"]
    - id: "tooling"
      label: "Tooling"
      description: "Tool-specific workflow skills"
      match:
        capabilities: ["git_workflow", "ci_cd", "cost_optimization", "model_cost_control"]
        tags: ["tooling", "git", "ci", "cost", "model-selection"]
        description_patterns: ["git", "ci/cd", "browser", "cost", "cheap", "low-cost", "model"]
    - id: "meta"
      label: "Meta"
      description: "Skills that orchestrate other skills"
      match:
        capabilities: ["orchestration"]
        tags: ["meta", "orchestrator"]
        description_patterns: ["orchestrat", "meta-skill", "discovery"]
    - id: "uncategorized"
      label: "Uncategorized"
      description: "Skills not matching any category"
      match:
        capabilities: []
        tags: []
        description_patterns: []
invocation_resolution:
  resolution_order:
    - "slot_override"
    - "capability_override"
    - "default_skill"
    - "provider_lookup"
  unresolved:
    required: "warn"
    optional: "warn"
  invalid_override:
    unknown_skill: "warn"
    capability_mismatch: "warn"
    override_not_allowed: "warn"
validation:
  invocation:
    enabled: true
artifacts:
  protocol:
    flow_profile: "implementation-flow-profile.json"
    report: "validation-report.json"
readable_outputs:
  include:
    - "skill_reference_catalog"
    - "flow_profile"
