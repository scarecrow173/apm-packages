# yaml-language-server: $schema=../../../skill-discovery-protocol/schemas/adapter.schema.json
schema_version: "1.0"
adapter_id: "briefing-flow-default"
extends:
  - "general"
profile:
  title: "Briefing Profile"
flow_stack:
  slots:
    - slot_id: "frame_structure"
      slot_type: "layerable"
      activation: "conditional"
      default:
        - skill: "deep-dive"
          reason: "Codebase-aware interrogation for ambiguous requests"
    - slot_id: "discover_gather"
      slot_type: "layerable"
      activation: "conditional"
      default:
        - skill: "steer-web-research"
          reason: "External research for A-5 paths"
    - slot_id: "discovery_output"
      slot_type: "layerable"
      activation: "conditional"
      default:
        - skill: "discovery-doc"
          reason: "Persist exploration results as a canonical discovery artifact when the problem space is ambiguous or alternatives exist"
    - slot_id: "spec_output"
      slot_type: "layerable"
      activation: "always"
      default:
        - skill: "spec-doc"
          reason: "All briefings produce spec-doc output"
    - slot_id: "adr_output"
      slot_type: "layerable"
      activation: "always"
      default:
        - skill: "adr-doc"
          reason: "All briefings produce adr-doc output"
classification:
  unmatched:
    action: "assign"
    category: "uncategorized"
    severity: "warn"
  taxonomy:
    - id: "frame"
      label: "Frame"
      description: "Skills that structure problems or options"
      match:
        capabilities: ["problem_framing", "option_analysis", "requirements_interrogation"]
        tags: ["frame", "structure", "organize"]
        description_patterns: ["structure", "organize", "define", "interrogate", "clarify"]
    # Lane boundary (#146): discover and research are distinct lanes.
    # discover = broad/internal information gathering and exploration.
    # research = explicitly external web research only.
    # discover patterns are anchored at word starts ("\b") so that
    # "research" cannot leak into discover through the shared substring
    # "search"; inflections ("exploration", "searching", "gathering",
    # "discovery") still match. A skill that genuinely spans both lanes
    # (e.g., declares both information_gathering and web_research) remains
    # a correct multi-category member.
    - id: "discover"
      label: "Discover"
      description: "Skills that gather and explore broad or internal information"
      match:
        capabilities: ["information_gathering"]
        tags: ["discover", "search", "explore"]
        description_patterns: ["\\bexplore", "\\bsearch", "\\bfind", "\\bgather", "\\bdiscover"]
    - id: "research"
      label: "Research"
      description: "Skills that conduct external web research"
      match:
        capabilities: ["web_research"]
        tags: ["research", "web", "external", "deep-dive"]
        description_patterns: ["research", "web research", "external", "deep dive", "literature", "look up"]
    - id: "document"
      label: "Document"
      description: "Skills that produce formal documents"
      match:
        capabilities: ["spec_authoring", "adr_authoring", "discovery_authoring", "idea_authoring"]
        tags: ["document", "spec", "adr", "discovery", "idea"]
        description_patterns: ["spec", "adr", "document", "record", "discovery", "idea"]
    - id: "meta"
      label: "Meta"
      description: "Skills that orchestrate other skills"
      match:
        capabilities: ["orchestration"]
        tags: ["meta", "orchestrator"]
        description_patterns: ["orchestrat", "meta-skill", "discovery"]
    - id: "uncategorized"
      label: "Uncategorized"
      description: "Skills not matching any category"
      match:
        capabilities: []
        tags: []
        description_patterns: []
invocation_resolution:
  overrides:
    slots: {}
    capabilities: {}
  resolution_order:
    - "slot_override"
    - "capability_override"
    - "default_skill"
    - "provider_lookup"
  unresolved:
    required: "warn"
    optional: "warn"
  invalid_override:
    unknown_skill: "warn"
    capability_mismatch: "warn"
    override_not_allowed: "warn"
validation:
  invocation:
    enabled: true
artifacts:
  protocol:
    flow_profile: "briefing-profile.json"
    report: "validation-report.json"
readable_outputs:
  include:
    - "skill_reference_catalog"
    - "flow_profile"
