# yaml-language-server: $schema=../../skill-discovery-protocol/schemas/adapter.schema.json
schema_version: "1.0"
adapter_id: "briefing-flow-default"
extends:
  - "general"
protocol:
  name: "skill-discovery-protocol"
  min_version: "1.0"
profile:
  title: "Briefing Profile"
flow_stack:
  slots:
    - slot_id: "frame_structure"
      slot_type: "layerable"
      activation: "conditional"
      default:
        skill: "idea-refine"
        reason: "Problem/option framing for A-1/A-2 paths"
    - slot_id: "discover_gather"
      slot_type: "layerable"
      activation: "conditional"
      default:
        skill: "steer-web-research"
        reason: "External research for A-5 paths"
    - slot_id: "validate_check"
      slot_type: "layerable"
      activation: "conditional"
      default:
        skill: "doubt-driven-development"
        reason: "Accuracy verification for gathered information"
    - slot_id: "document_output"
      slot_type: "layerable"
      activation: "always"
      default:
        skill: "spec-doc"
        reason: "All briefings produce spec-doc output"
classification:
  unmatched:
    action: "assign"
    category: "uncategorized"
    severity: "warn"
  taxonomy:
    - id: "frame"
      label: "Frame"
      description: "Skills that structure problems or options"
      match:
        capabilities: ["problem_framing", "option_analysis", "brainstorming"]
        tags: ["frame", "structure", "organize"]
        description_patterns: ["structure", "organize", "define", "refine", "brainstorm"]
    - id: "discover"
      label: "Discover"
      description: "Skills that explore and find information"
      match:
        capabilities: ["web_research", "information_gathering"]
        tags: ["discover", "search", "explore"]
        description_patterns: ["explore", "search", "find", "gather", "web research"]
    - id: "research"
      label: "Research"
      description: "Skills that conduct deep-dive investigation"
      match:
        capabilities: ["source_verification", "deep_research"]
        tags: ["research", "investigation"]
        description_patterns: ["investigate", "reference", "evidence", "primary source"]
    - id: "validate"
      label: "Validate"
      description: "Skills that verify accuracy and completeness"
      match:
        capabilities: ["adversarial_review", "assumption_checking"]
        tags: ["validate", "verify", "adversarial"]
        description_patterns: ["verify", "validat", "adversarial", "assumption"]
    - id: "document"
      label: "Document"
      description: "Skills that produce formal documents"
      match:
        capabilities: ["spec_authoring", "adr_authoring"]
        tags: ["document", "spec", "adr"]
        description_patterns: ["spec", "adr", "document", "record"]
    - id: "meta"
      label: "Meta"
      description: "Skills that orchestrate other skills"
      match:
        capabilities: ["orchestration"]
        tags: ["meta", "orchestrator"]
        description_patterns: ["orchestrat", "meta-skill", "discovery"]
    - id: "uncategorized"
      label: "Uncategorized"
      description: "Skills not matching any category"
      match:
        capabilities: []
        tags: []
        description_patterns: []
invocation_resolution:
  overrides:
    slots: {}
    capabilities: {}
  resolution_order:
    - "slot_override"
    - "capability_override"
    - "default_skill"
    - "provider_lookup"
  unresolved:
    required: "warn"
    optional: "warn"
  invalid_override:
    unknown_skill: "warn"
    capability_mismatch: "warn"
    override_not_allowed: "warn"
validation:
  schema: true
  staleness:
    enabled: true
    basis: "validated_at"
    max_age_days: 30
  deterministic:
    enabled: true
    compare:
      - "profile"
      - "profile+catalog-artifacts"
      - "validation-report:exclude-timestamp"
  invocation:
    enabled: true
render:
  stable_sort:
    skills: ["name"]
    invocations: ["source_skill", "slot", "capability"]
  normalize_whitespace: true
  newline: "lf"
artifacts:
  protocol:
    catalog: "skill-reference-catalog.json"
    profile: "briefing-profile.json"
    report: "validation-report.json"
readable_outputs:
  enabled: true
  include:
    catalog: true
    profile: true
