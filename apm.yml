name: apm-packages
version: 0.1.0
description: A collection of APM packages for research, skills, agents, and prompts
author: Akiyoshi Koyama
license: MIT
targets:
- copilot
- claude
- cursor
- codex
- agent-skills
devDependencies:
  apm:
  - ./packages/basic-dev-foundation
  - ./packages/recommended-dev-suite
  - ./packages/steer-enterprise-web-research
  - ./packages/doc-driven-dev
  - ./packages/apm-package-judge
  mcp:
  - name: mise
    registry: false
    transport: stdio
    command: mise
    args:
    - mcp
    env:
      MISE_EXPERIMENTAL: '1'
marketplace:
  owner:
    name: scarecrow173
    url: https://github.com/scarecrow173
  outputs:
    codex: {}
    copilot: {}
    cursor: {}
    claude: {}
    agent-skills: {}
  versioning:
    strategy: lockstep
  packages:
  - name: basic-dev-foundation
    source: ./packages/basic-dev-foundation
    version: 0.1.0
  - name: recommended-dev-suite
    source: ./packages/recommended-dev-suite
    version: 0.1.0
  - name: steer-enterprise-web-research
    source: ./packages/steer-enterprise-web-research
    version: 0.1.0
  - name: doc-driven-dev
    source: ./packages/doc-driven-dev
    version: 0.1.0
  - name: apm-package-judge
    source: ./packages/apm-package-judge
    version: 0.1.0
  - name: skill-judge
    source: softaworks/agent-toolkit
    subdir: skills/skill-judge
    ref: main
