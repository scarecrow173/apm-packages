name: apm-packages
version: 0.1.0
description: A collection of APM packages for research, skills, agents, and prompts
author: Akiyoshi Koyama
license: MIT
targets:
- copilot
- claude
- cursor
- codex
- agent-skills
devDependencies:
  apm:
  - ./packages/basic-dev-foundation
  - ./packages/recommended-dev-suite
  - ./packages/steer-enterprise-web-research
  - ./packages/doc-driven-dev
  - ./packages/apm-package-judge
  - ./packages/github-automation
  - ./packages/security-governance
  - ./packages/visualization
  - ./packages/token-compression
  mcp:
  - name: mise
    registry: false
    transport: stdio
    command: mise
    args:
    - mcp
    env:
      MISE_EXPERIMENTAL: '1'
marketplace:
  owner:
    name: scarecrow173
    url: https://github.com/scarecrow173
  outputs:
    codex: {}
    claude: {}
  claude:
    output: .claude-plugin/marketplace.json
  codex:
    output: .agents/plugins/marketplace.json
  versioning:
    strategy: lockstep
  packages:
  - name: basic-dev-foundation
    category: foundation
    source: scarecrow173/apm-packages
    subdir: packages/basic-dev-foundation

  - name: recommended-dev-suite
    category: workflow
    source: scarecrow173/apm-packages
    subdir: packages/recommended-dev-suite

  - name: steer-enterprise-web-research
    category: research
    source: scarecrow173/apm-packages
    subdir: packages/steer-enterprise-web-research

  - name: doc-driven-dev
    category: documentation
    source: scarecrow173/apm-packages
    subdir: packages/doc-driven-dev

  - name: apm-package-judge
    category: evaluation
    source: scarecrow173/apm-packages
    subdir: packages/apm-package-judge

  - name: github-automation
    category: automation
    source: scarecrow173/apm-packages
    subdir: packages/github-automation

  - name: security-governance
    category: security
    source: scarecrow173/apm-packages
    subdir: packages/security-governance

  - name: visualization
    category: design
    source: scarecrow173/apm-packages
    subdir: packages/visualization

  - name: token-compression
    category: optimization
    source: scarecrow173/apm-packages
    subdir: packages/token-compression

